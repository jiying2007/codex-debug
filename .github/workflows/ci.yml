name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.22.2', '24.19.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install native and Cortex-M fixture tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gdb binutils-arm-none-eabi
          command -v gdb
          command -v arm-none-eabi-as
          command -v arm-none-eabi-ld
          command -v arm-none-eabi-nm
          command -v arm-none-eabi-addr2line
          gdb --version | head -n 1
          arm-none-eabi-addr2line --version | head -n 1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run ci

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: 22.22.2
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: node src/codex-safe-core/scripts/verify-package-licenses.js .

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [test, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all gates
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node - <<'NODE'
          const needs=JSON.parse(process.env.NEEDS_JSON);
          const failed=Object.entries(needs).filter(([,v])=>v.result!=='success');
          if(failed.length){console.error(failed.map(([k,v])=>`${k}=${v.result}`).join(', '));process.exit(1);}
          NODE
