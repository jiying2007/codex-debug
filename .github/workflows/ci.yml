name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.22.2', '24.19.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install native and Cortex-M fixture tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gdb binutils-arm-none-eabi
          command -v gdb
          command -v arm-none-eabi-as
          command -v arm-none-eabi-ld
          command -v arm-none-eabi-nm
          command -v arm-none-eabi-addr2line
          command -v cc
          command -v ld
          command -v nm
          command -v readelf
          command -v addr2line
          gdb --version | head -n 1
          arm-none-eabi-addr2line --version | head -n 1
          addr2line --version | head -n 1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run ci

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: 22.22.2
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: node src/codex-safe-core/scripts/verify-package-licenses.js .

  promotion-provenance:
    name: Promotion Provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: 22.22.2
      - name: Prove reviewed refs, direct-parent fixes, and ground-truth files without executing historical code
        run: node scripts/promotion-provenance.js --output promotion-provenance/PROMOTION_PROVENANCE.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-debug-promotion-provenance-${{ github.sha }}
          path: promotion-provenance/PROMOTION_PROVENANCE.json
          if-no-files-found: error
          retention-days: 14

  consumer-evidence:
    name: Consumer Evidence
    needs: [test, security, promotion-provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build two reproducible VSIX candidates
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir=consumer-evidence
          version=$(node -p "require('./package.json').version")
          vsix_name="codex-debug-safe-${version}.vsix"
          test -n "$version"
          mkdir -p "$evidence_dir"
          npx --yes @vscode/vsce@3.9.2 --version
          epoch=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH="$epoch"
          while IFS= read -r -d '' file; do touch -h -d "@${epoch}" "$file"; done < <(find . -path './.git' -prune -o -path './node_modules' -prune -o -path './consumer-evidence' -prune -o -print0)
          npx --yes @vscode/vsce@3.9.2 package --no-dependencies --out codex-debug-safe-a.vsix
          npx --yes @vscode/vsce@3.9.2 package --no-dependencies --out codex-debug-safe-b.vsix
          sha_a=$(sha256sum codex-debug-safe-a.vsix | awk '{print $1}')
          sha_b=$(sha256sum codex-debug-safe-b.vsix | awk '{print $1}')
          test "$sha_a" = "$sha_b" || { echo "VSIX is not reproducible: ${sha_a} != ${sha_b}" >&2; exit 1; }
          cp codex-debug-safe-a.vsix "$evidence_dir/$vsix_name"
          unzip -Z1 "$evidence_dir/$vsix_name" > /tmp/vsix-files.txt
          grep -Fx 'extension/extension.js' /tmp/vsix-files.txt
          grep -Fx 'extension/src/debug.js' /tmp/vsix-files.txt
          grep -Fx 'extension/src/platform-symbols.js' /tmp/vsix-files.txt
          grep -Fx 'extension/src/codex-safe-core/index.js' /tmp/vsix-files.txt
          if grep -E '^extension/(test|quality|scripts|\.github|\.codex-debug|\.git)(/|$)' /tmp/vsix-files.txt; then echo 'VSIX contains development/private surfaces' >&2; exit 1; fi
          printf '%s  %s\n' "$sha_a" "$vsix_name" > "$evidence_dir/VSIX_SHA256"
      - name: Generate Consumer CI Receipt and checksums
        env:
          CI_SOURCE_SHA: ${{ github.sha }}
          CI_WORKFLOW_NAME: CI
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_EVENT: ${{ github.event_name }}
          CI_SUITES: matrix-linux-windows-macos-node22-24,security,quality,executable-fix-quality,model-evaluation-contract,promotion-corpus-contract,promotion-transition-e2e,promotion-provenance,real-native-core,real-cortex-m,android-buildid,kernel-system-map,kernel-kaslr,kernel-module-buildid,rollback-receipt-lineage,package-contract,reproducible-vsix
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir=consumer-evidence
          version=$(node -p "require('./package.json').version")
          vsix_name="codex-debug-safe-${version}.vsix"
          test -s "$evidence_dir/$vsix_name"
          node src/codex-safe-core/scripts/generate-consumer-ci-receipt.js --output "$evidence_dir/CONSUMER_CI_RECEIPT.json"
          test -s "$evidence_dir/CONSUMER_CI_RECEIPT.json"
          (cd "$evidence_dir" && sha256sum "$vsix_name" CONSUMER_CI_RECEIPT.json > SHA256SUMS)
          grep -F "$vsix_name" "$evidence_dir/SHA256SUMS"
          grep -F 'CONSUMER_CI_RECEIPT.json' "$evidence_dir/SHA256SUMS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-debug-safe-consumer-evidence-${{ github.sha }}
          path: consumer-evidence/
          if-no-files-found: error
          retention-days: 14

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [test, security, promotion-provenance, consumer-evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all gates
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node - <<'NODE'
          const needs=JSON.parse(process.env.NEEDS_JSON);
          const failed=Object.entries(needs).filter(([,v])=>v.result!=='success');
          if(failed.length){console.error(failed.map(([k,v])=>`${k}=${v.result}`).join(', '));process.exit(1);}
          NODE
