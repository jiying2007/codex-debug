name: Prepare Android ABI vendor evidence

on:
  push:
    branches:
      - codex/android-abi-vendor-evidence

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: 22.22.2
      - name: Prepare runtime and real fixture patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/prepare-android-abi-vendor.js')
          s=p.read_text()
          old="allowed=new Set(['package.json','package-lock.json','product-contract.json','ROADMAP.md','README.md','README.zh-CN.md','ARCHITECTURE.md'])"
          new="allowed=new Set(['.github/workflows/ci.yml','.github/workflows/immutable-release.yml','.github/workflows/live-model-eval.yml','.github/workflows/prepare-android-abi-vendor.yml','.github/workflows/promotion-corpus-qualify.yml','.github/workflows/promotion-model-eval.yml','MODEL_EVALUATION.md','ROADMAP.md','docs/PROMOTION_ADMISSION.md','package-lock.json','package.json','product-contract.json','scripts/prepare-android-abi-vendor.js','scripts/verify-docs.js','test/immutable-release-authority.test.js'])"
          if old not in s: raise SystemExit('preparation allowlist marker missing')
          p.write_text(s.replace(old,new,1))
          PY
          node scripts/prepare-android-abi-vendor.js
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/prepare-android-abi-vendor.yml|scripts/prepare-android-abi-vendor.js) continue ;;
            esac
            sed -i 's/0\.1\.12/0.1.13/g' "$file"
          done < <(git grep -l '0.1.12' || true)
      - name: Write shell-safe Android ABI vendor fixture
        shell: bash
        run: |
          cat > test/android-abi-vendor-real-e2e.test.js <<'NODE'
          'use strict';
          const test=require('node:test');const assert=require('node:assert/strict');const fs=require('node:fs');const os=require('node:os');const path=require('node:path');const {execFileSync,spawnSync}=require('node:child_process');const {symbolizePlatform,androidAbiCompatibility}=require('../src/platform-symbols');
          function exists(cmd){return spawnSync('sh',['-lc','command -v '+cmd],{stdio:'ignore'}).status===0;}
          function buildId(elf){const out=execFileSync('readelf',['-n',elf],{encoding:'utf8'}),m=out.match(/Build ID:\s*([0-9a-f]+)/i);assert.ok(m);return m[1].toLowerCase();}
          function symbolAddress(elf,name){const out=execFileSync('nm',['-D','-n',elf],{encoding:'utf8'}),m=out.match(new RegExp('^([0-9a-fA-F]+)\\s+[TtWw]\\s+'+name+'$','m'));assert.ok(m);return m[1].toLowerCase();}
          test('Android ABI compatibility maps supported tombstone ABIs to exact ELF identities',()=>{assert.equal(androidAbiCompatibility('x86_64',{elfClass:'ELF64',machine:'Advanced Micro Devices X86-64'}).status,'matched');assert.equal(androidAbiCompatibility('arm64',{elfClass:'ELF64',machine:'Advanced Micro Devices X86-64'}).status,'mismatch');assert.equal(androidAbiCompatibility('future-abi',{elfClass:'ELF64',machine:'Future'}).status,'unsupported');assert.equal(androidAbiCompatibility('',{elfClass:'ELF64',machine:'AArch64'}).status,'not-provided');});
          test('real Android vendor/system same-basename fixture binds exact vendor ELF and rejects ABI mismatch',{skip:process.platform!=='linux'},()=>{for(const tool of ['cc','nm','readelf','addr2line'])assert.equal(exists(tool),true,'Linux Android ABI/vendor fixture requires '+tool);const root=fs.mkdtempSync(path.join(os.tmpdir(),'codex-android-vendor-'));try{for(const area of ['vendor','system'])fs.mkdirSync(path.join(root,area),{recursive:true});const vendorSrc=path.join(root,'vendor','vendor.c'),systemSrc=path.join(root,'system','system.c'),vendorElf=path.join(root,'vendor','libcollision.so'),systemElf=path.join(root,'system','libcollision.so');fs.writeFileSync(vendorSrc,'__attribute__((visibility("default"),noinline)) void vendor_crash_fixture(void) { volatile int *p = 0; *p = 11; }\n');fs.writeFileSync(systemSrc,'__attribute__((visibility("default"),noinline)) void system_crash_fixture(void) { volatile int *p = 0; *p = 22; }\n');execFileSync('cc',['-shared','-fPIC','-g','-O0','-Wl,--build-id=sha1','-o',vendorElf,vendorSrc],{stdio:'pipe'});execFileSync('cc',['-shared','-fPIC','-g','-O0','-Wl,--build-id=sha1','-o',systemElf,systemSrc],{stdio:'pipe'});const id=buildId(vendorElf),pc=symbolAddress(vendorElf,'vendor_crash_fixture'),module='/vendor/lib64/libcollision.so',text="ABI: 'x86_64'\n#00 pc "+pc+' '+module+' (vendor_crash_fixture+0) (BuildId: '+id+')\n',specs=['/system/lib64/libcollision.so='+systemElf,'/vendor/lib64/libcollision.so='+vendorElf],symbols=symbolizePlatform({text,androidSymbolSpecs:specs,cwd:root}),row=symbols.android.resolutions[0];assert.equal(row.status,'resolved');assert.equal(row.abiMatch,true);assert.equal(row.expectedAbi,'x86_64');assert.equal(row.elfClass,'ELF64');assert.equal(row.elfMachine,'Advanced Micro Devices X86-64');assert.equal(row.function,'vendor_crash_fixture');assert.match(row.location,/vendor\/vendor\.c:1/);assert.equal(row.symbolFile.fileName,'libcollision.so');const mismatch=symbolizePlatform({text:text.replace("ABI: 'x86_64'","ABI: 'arm64'"),androidSymbolSpecs:specs,cwd:root}).android.resolutions[0];assert.equal(mismatch.status,'abi-mismatch');assert.equal(mismatch.abiMatch,false);assert.equal(mismatch.expectedAbi,'arm64');assert.equal(mismatch.expectedMachine,'AArch64');assert.equal(mismatch.elfMachine,'Advanced Micro Devices X86-64');assert.equal(mismatch.function,undefined);assert.equal(mismatch.location,undefined);}finally{fs.rmSync(root,{recursive:true,force:true});}});
          NODE
      - name: Validate prepared patch
        shell: bash
        run: |
          set -euo pipefail
          node --check src/platform-symbols.js
          node --test test/android-abi-vendor-real-e2e.test.js
          test -z "$(git grep -l '0.1.12' -- ':!.github/workflows/prepare-android-abi-vendor.yml' ':!scripts/prepare-android-abi-vendor.js' || true)"
          git diff --check
          git status --short
      - name: Commit patch and remove preparation surfaces
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/prepare-android-abi-vendor.yml scripts/prepare-android-abi-vendor.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(android): bind tombstone ABI to ELF identity'
          git push origin HEAD:codex/android-abi-vendor-evidence
