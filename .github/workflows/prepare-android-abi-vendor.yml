name: Prepare Android ABI vendor evidence

on:
  push:
    branches:
      - codex/android-abi-vendor-evidence

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: 22.22.2
      - name: Prepare runtime and real fixture patch
        run: node scripts/prepare-android-abi-vendor.js
      - name: Validate prepared patch
        shell: bash
        run: |
          set -euo pipefail
          node --check src/platform-symbols.js
          node --test test/android-abi-vendor-real-e2e.test.js
          git diff --check
          git status --short
      - name: Commit patch and remove preparation surfaces
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/prepare-android-abi-vendor.yml scripts/prepare-android-abi-vendor.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/platform-symbols.js test/android-abi-vendor-real-e2e.test.js .github/workflows/ci.yml package.json package-lock.json product-contract.json ROADMAP.md
          git commit -m 'feat(android): bind tombstone ABI to ELF identity'
          git push origin HEAD:codex/android-abi-vendor-evidence
