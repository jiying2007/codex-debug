name: Promotion Model Evaluation

on:
  workflow_dispatch:
    inputs:
      codex_version:
        description: Codex CLI version or latest
        required: true
        default: latest
        type: string
      model:
        description: Optional fixed hypothesis model; empty uses Safe Core auto selection
        required: false
        default: ''
        type: string
      verifier_model:
        description: Optional fixed verifier model; empty follows the hypothesis model
        required: false
        default: ''
        type: string
      promotion_mode:
        description: Require qualification, reviewed admission policy, and promotion-eligible live evidence
        required: true
        default: false
        type: boolean
      acknowledge_historical_execution:
        description: I acknowledge reviewed historical repository code will execute without an OS sandbox
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  promotion-model-eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CODEX_DEBUG_MODEL: ${{ inputs.model }}
      CODEX_DEBUG_VERIFIER_MODEL: ${{ inputs.verifier_model }}
      CODEX_DEBUG_MODEL_SELECTION_STRATEGY: ${{ inputs.model != '' && 'fixed' || 'auto' }}
      CODEX_DEBUG_MODEL_COMPATIBILITY_POLICY: strict
      CODEX_DEBUG_PROVIDER_MODE: openai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Require explicit historical-execution authority
        if: ${{ !inputs.acknowledge_historical_execution }}
        shell: bash
        run: |
          echo 'Historical promotion evaluation executes reviewed old repository code and is not an OS sandbox. Explicit acknowledgement is required.' >&2
          exit 2
      - name: Install selected Codex CLI
        env:
          CODEX_VERSION: ${{ inputs.codex_version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CODEX_VERSION" =~ ^(latest|[0-9]+\.[0-9]+\.[0-9]+)$ ]] || {
            echo 'codex_version must be latest or an exact x.y.z version.' >&2
            exit 2
          }
          npm install --global "@openai/codex@${CODEX_VERSION}"
          codex --version
      - name: Validate reviewed promotion corpus and admission policy
        run: |
          node scripts/promotion-corpus.js quality/promotion-corpus.json
          node scripts/promotion-admission.js --policy quality/promotion-admission-policy.json --validate-policy-only
      - name: Qualify historical transitions for this exact evaluation run
        run: |
          node scripts/promotion-qualify.js --output PROMOTION_CORPUS_QUALIFICATION.json
          test -s PROMOTION_CORPUS_QUALIFICATION.json
      - name: Record historical live-model evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.CODEX_DEBUG_CANARY_OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
          PROMOTION_MODE: ${{ inputs.promotion_mode }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}" || {
            echo 'CODEX_DEBUG_CANARY_OPENAI_API_KEY (preferred) or OPENAI_API_KEY is unavailable; refusing live promotion evaluation.' >&2
            exit 2
          }
          args=(--output PROMOTION_MODEL_EVAL.json --summary PROMOTION_MODEL_EVAL_SUMMARY.json --transitions PROMOTION_TRANSITIONS.json)
          if [[ "$PROMOTION_MODE" == true ]]; then args+=(--require-promotion-ready); fi
          node scripts/promotion-live-eval.js "${args[@]}"
          test -s PROMOTION_MODEL_EVAL.json
          test -s PROMOTION_MODEL_EVAL_SUMMARY.json
          test -s PROMOTION_TRANSITIONS.json
      - name: Fail closed on model safety regressions
        env:
          PROMOTION_MODE: ${{ inputs.promotion_mode }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const s=require('./PROMOTION_MODEL_EVAL_SUMMARY.json');
          if(s.falseSupport!==0||s.falseFixCandidates!==0||s.patchPolicyViolations!==0){
            console.error(JSON.stringify({falseSupport:s.falseSupport,falseFixCandidates:s.falseFixCandidates,patchPolicyViolations:s.patchPolicyViolations}));
            process.exit(2);
          }
          if(process.env.PROMOTION_MODE==='true'&&s.claimableLiveMetric!==true){
            console.error('promotion_mode requires claimableLiveMetric=true');
            process.exit(2);
          }
          NODE
      - name: Bind qualification, live metrics, and promotion admission policy
        env:
          PROMOTION_MODE: ${{ inputs.promotion_mode }}
        shell: bash
        run: |
          set -euo pipefail
          cp quality/promotion-admission-policy.json PROMOTION_ADMISSION_POLICY.json
          args=(--policy PROMOTION_ADMISSION_POLICY.json --qualification PROMOTION_CORPUS_QUALIFICATION.json --record PROMOTION_MODEL_EVAL.json --output PROMOTION_ADMISSION.json)
          if [[ "$PROMOTION_MODE" == true ]]; then args+=(--require-promotion-eligible); fi
          node scripts/promotion-admission.js "${args[@]}"
          test -s PROMOTION_ADMISSION.json
          test -s PROMOTION_ADMISSION_POLICY.json
      - name: Re-validate promotion admission receipt
        env:
          PROMOTION_MODE: ${{ inputs.promotion_mode }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--policy PROMOTION_ADMISSION_POLICY.json --qualification PROMOTION_CORPUS_QUALIFICATION.json --record PROMOTION_MODEL_EVAL.json --admission PROMOTION_ADMISSION.json)
          if [[ "$PROMOTION_MODE" == true ]]; then args+=(--require-promotion-eligible); fi
          node scripts/validate-promotion-admission.js "${args[@]}"
      - name: Build calibration review report
        shell: bash
        run: |
          set -euo pipefail
          node scripts/promotion-calibration-report.js \
            --policy PROMOTION_ADMISSION_POLICY.json \
            --qualification PROMOTION_CORPUS_QUALIFICATION.json \
            --record PROMOTION_MODEL_EVAL.json \
            --admission PROMOTION_ADMISSION.json \
            --output PROMOTION_CALIBRATION_REPORT.json
          test -s PROMOTION_CALIBRATION_REPORT.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-debug-promotion-model-eval-${{ github.sha }}-${{ github.run_id }}
          path: |
            PROMOTION_CORPUS_QUALIFICATION.json
            PROMOTION_MODEL_EVAL.json
            PROMOTION_MODEL_EVAL_SUMMARY.json
            PROMOTION_TRANSITIONS.json
            PROMOTION_ADMISSION_POLICY.json
            PROMOTION_ADMISSION.json
            PROMOTION_CALIBRATION_REPORT.json
          if-no-files-found: error
          retention-days: 14
